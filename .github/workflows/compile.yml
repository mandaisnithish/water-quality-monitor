name: Compile sketches

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Cache Arduino cores and libraries
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-${{ hashFiles('scripts/install_deps.sh') }}

      - name: Install cores and libraries
        run: scripts/install_deps.sh

      - name: Compile all sketches
        run: scripts/compile_all.sh
